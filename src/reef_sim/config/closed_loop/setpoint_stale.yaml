# Closed-loop scenario overlay (P07b): setpoint publisher stops during a 0.3 m/s forward leg (6 s), then hover resumes
# Merged over x3_scenario.yaml, x3_reef_overlay.yaml and x3_closed_loop.yaml by
# run_x3_scenario.sh --closed-loop with REEF_X3_CL_SCENARIO=setpoint_stale.
# Criteria: docs/ACCEPTANCE.md (control/faults, P07b). Test hooks are labelled
# and enabled only here.
simulation:
  ros__parameters:
    scenario: setpoint_stale
closed_loop_runner:
  ros__parameters:
    phase_names:
    - settle
    - takeoff_hover
    - forward
    - stale
    - recover
    - approach
    - land
    - disarmed
    phase_durations:
