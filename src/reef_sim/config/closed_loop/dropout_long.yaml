# Closed-loop scenario overlay (P07b): IMU drop until the end: estimates stop, offboard timeout, crash (expected)
# Merged over x3_scenario.yaml, x3_reef_overlay.yaml and x3_closed_loop.yaml by
# run_x3_scenario.sh --closed-loop with REEF_X3_CL_SCENARIO=dropout_long.
# Criteria: docs/ACCEPTANCE.md (control/faults, P07b). Test hooks are labelled
# and enabled only here.
